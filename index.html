<script>

/* =====================================================
   CONFIG
   ===================================================== */

const ADMIN_USERNAME = "instagame";

const USERS_KEY = "instagame_users_v4";
const POSTS_KEY = "instagame_posts_v4";
const CURRENT_KEY = "instagame_current_v4";
const REMEMBER_KEY = "instagame_remember_v4";
const SESSION_KEY = "instagame_session_v4";


/* =====================================================
   DATA
   ===================================================== */

let users =
    JSON.parse(
        localStorage.getItem(USERS_KEY)
    ) || [];

let posts =
    JSON.parse(
        localStorage.getItem(POSTS_KEY)
    ) || [];

let currentUserId = null;
let selectedImage = null;
let currentCommentPost = null;


/* =====================================================
   SAVE
   ===================================================== */

function save(){

    localStorage.setItem(
        USERS_KEY,
        JSON.stringify(users)
    );

    localStorage.setItem(
        POSTS_KEY,
        JSON.stringify(posts)
    );
}


/* =====================================================
   USER
   ===================================================== */

function getUser(id){

    return users.find(
        u => u.id === id
    );
}

function currentUser(){

    return getUser(currentUserId);
}

function isAdmin(){

    const user = currentUser();

    if(!user) return false;

    return user.username.toLowerCase()
        === ADMIN_USERNAME.toLowerCase();
}


/* =====================================================
   AUTH
   ===================================================== */

function showRegister(){

    document
        .getElementById("loginForm")
        .classList.add("hidden");

    document
        .getElementById("registerForm")
        .classList.remove("hidden");

    clearError();
}

function showLogin(){

    document
        .getElementById("registerForm")
        .classList.add("hidden");

    document
        .getElementById("loginForm")
        .classList.remove("hidden");

    clearError();
}

function setError(text){

    document
        .getElementById("authError")
        .textContent = text;
}

function clearError(){

    document
        .getElementById("authError")
        .textContent = "";
}


/* =====================================================
   REGISTER
   ===================================================== */

function register(){

    const username =
        document
        .getElementById("registerUsername")
        .value
        .trim()
        .toLowerCase();

    const name =
        document
        .getElementById("registerName")
        .value
        .trim();

    const password =
        document
        .getElementById("registerPassword")
        .value;

    const password2 =
        document
        .getElementById("registerPassword2")
        .value;


    if(!username || !name || !password || !password2){

        setError("Completează toate câmpurile.");

        return;
    }

    if(username.length < 3){

        setError("Username-ul trebuie să aibă cel puțin 3 caractere.");

        return;
    }

    if(!/^[a-z0-9_.]+$/.test(username)){

        setError("Username-ul poate conține doar litere, cifre, _ și .");

        return;
    }

    if(password.length < 4){

        setError("Parola trebuie să aibă cel puțin 4 caractere.");

        return;
    }

    if(password !== password2){

        setError("Parolele nu sunt identice.");

        return;
    }

    const exists =
        users.some(
            u =>
            u.username.toLowerCase()
            === username
        );

    if(exists){

        setError("Acest username există deja.");

        return;
    }

    const user = {

        id:
            "user_" +
            Date.now() +
            "_" +
            Math.random()
            .toString(36)
            .slice(2),

        username,

        name,

        password,

        avatar:"",

        bio:"",

        verified:false,

        admin:
            username === ADMIN_USERNAME,

        followers:[],

        following:[],

        followerDisplay:null,

        createdAt:Date.now()
    };


    users.push(user);

    save();

    currentUserId = user.id;

    localStorage.setItem(
        CURRENT_KEY,
        currentUserId
    );

    localStorage.setItem(
        REMEMBER_KEY,
        "true"
    );

    openApp();

    toast("Cont creat cu succes! 🎉");
}


/* =====================================================
   LOGIN
   ===================================================== */

function login(){

    const username =
        document
        .getElementById("loginUsername")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("loginPassword")
        .value;

    const remember =
        document
        .getElementById("rememberMe")
        .checked;


    const user =
        users.find(
            u =>
            u.username.toLowerCase()
            === username &&
            u.password === password
        );


    if(!user){

        setError(
            "Username sau parolă greșită."
        );

        return;
    }


    currentUserId = user.id;


    if(remember){

        localStorage.setItem(
            CURRENT_KEY,
            currentUserId
        );

        localStorage.setItem(
            REMEMBER_KEY,
            "true"
        );

        sessionStorage.removeItem(
            SESSION_KEY
        );

    }else{

        localStorage.removeItem(
            CURRENT_KEY
        );

        localStorage.removeItem(
            REMEMBER_KEY
        );

        sessionStorage.setItem(
            SESSION_KEY,
            currentUserId
        );
    }


    openApp();
}


/* =====================================================
   APP
   ===================================================== */

function openApp(){

    document
        .getElementById("authScreen")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");


    const adminButton =
        document.getElementById(
            "adminTopButton"
        );


    if(isAdmin()){

        adminButton
            .classList.remove("hidden");

    }else{

        adminButton
            .classList.add("hidden");
    }


    showHome();
}


/* =====================================================
   STARTUP
   ===================================================== */

function startup(){

    const savedId =
        localStorage.getItem(
            CURRENT_KEY
        );

    const sessionId =
        sessionStorage.getItem(
            SESSION_KEY
        );

    const remember =
        localStorage.getItem(
            REMEMBER_KEY
        );


    if(
        remember === "true" &&
        savedId &&
        getUser(savedId)
    ){

        currentUserId = savedId;

        openApp();

        return;
    }


    if(
        sessionId &&
        getUser(sessionId)
    ){

        currentUserId = sessionId;

        openApp();

        return;
    }


    showLogin();
}


/* =====================================================
   LOGOUT
   ===================================================== */

function logout(){

    localStorage.removeItem(
        CURRENT_KEY
    );

    localStorage.removeItem(
        REMEMBER_KEY
    );

    sessionStorage.removeItem(
        SESSION_KEY
    );

    currentUserId = null;

    document
        .getElementById("app")
        .classList.add("hidden");

    document
        .getElementById("authScreen")
        .classList.remove("hidden");

    showLogin();
}


/* =====================================================
   HOME
   ===================================================== */

function showHome(){

    setActive("navHome");

    page.innerHTML = `

        <div class="stories"
             id="stories">
        </div>

        <div id="feed">
            <div style="
                padding:40px;
                text-align:center;
                color:#888">
                Se încarcă...
            </div>
        </div>
    `;

    loadStories();
    loadFeed();
}


/* =====================================================
   STORIES
   ===================================================== */

function loadStories(){

    const stories =
        document.getElementById(
            "stories"
        );

    stories.innerHTML = "";

    users.forEach(user => {

        stories.innerHTML += `

            <div class="story"
                 onclick="openProfile('${user.id}')">

                <div class="story-avatar">

                    <img
                        src="${user.avatar || defaultAvatar(user.username)}">

                </div>

                <div>
                    ${escapeHtml(user.username)}
                </div>

            </div>
        `;
    });
}


/* =====================================================
   FEED
   ===================================================== */

function loadFeed(){

    const feed =
        document.getElementById(
            "feed"
        );

    feed.innerHTML = "";


    const sorted =
        [...posts]
        .sort(
            (a,b) =>
            b.createdAt - a.createdAt
        );


    if(sorted.length === 0){

        feed.innerHTML = `

            <div style="
                padding:50px;
                text-align:center;
                color:#888">

                Nu există încă postări.<br><br>

                Fii primul care postează! 📸

            </div>
        `;

        return;
    }


    sorted.forEach(post => {

        const user =
            getUser(post.userId);

        if(!user) return;


        const liked =
            (post.likes || [])
            .includes(currentUserId);


        const comments =
            post.comments || [];


        const verified =
            user.verified
            ? `<span class="verified">✓</span>`
            : "";


        const postElement =
            document.createElement(
                "div"
            );

        postElement.className =
            "post";


        postElement.innerHTML = `

            <div class="post-head"
                 onclick="openProfile('${user.id}')">

                <img
                    class="avatar"
                    src="${user.avatar || defaultAvatar(user.username)}">

                <div>

                    <div class="username">

                        ${escapeHtml(user.username)}

                        ${verified}

                    </div>

                    <div style="
                        color:#888;
                        font-size:12px">

                        ${escapeHtml(user.name)}

                    </div>

                </div>

            </div>


            ${
                post.image
                ? `
                    <img
                        class="post-image"
                        src="${post.image}">
                  `
                : ""
            }


            <div class="post-actions">

                <button
                    class="${liked ? "liked" : ""}"
                    onclick="toggleLike('${post.id}')">

                    ${liked ? "♥" : "♡"}

                </button>


                <button
                    onclick="openComments('${post.id}')">

                    💬

                </button>


                <button
                    onclick="sharePost('${post.id}')">

                    ↗

                </button>

            </div>


            <div class="post-info">

                <div class="likes">

                    ${(post.likes || []).length}
                    aprecieri

                </div>


                <div class="caption">

                    <b>
                        ${escapeHtml(user.username)}
                    </b>

                    ${escapeHtml(post.caption || "")}

                </div>


                <div
                    class="comments-link"
                    onclick="openComments('${post.id}')">

                    Vezi ${comments.length}
                    comentarii

                </div>

            </div>
        `;


        feed.appendChild(
            postElement
        );
    });
}


/* =====================================================
   CREATE POST
   ===================================================== */

function showCreate(){

    setActive("navCreate");

    selectedImage = null;


    page.innerHTML = `

        <div class="create-box">

            <h2>Postare nouă</h2>


            <textarea
                id="caption"
                placeholder="Scrie o descriere...">
            </textarea>


            <div class="file-box">

                <input
                    id="imageInput"
                    type="file"
                    accept="image/*">

            </div>


            <img
                id="preview"
                class="preview hidden">


            <button
                class="main-btn"
                onclick="createPost()">

                Publică

            </button>

        </div>
    `;


    document
        .getElementById("imageInput")
        .addEventListener(
            "change",
            previewImage
        );
}


function previewImage(event){

    const file =
        event.target.files[0];

    if(!file) return;


    if(file.size > 4 * 1024 * 1024){

        alert(
            "Imaginea este prea mare. Alege una sub 4 MB."
        );

        return;
    }


    const reader =
        new FileReader();


    reader.onload = function(){

        selectedImage =
            reader.result;


        const preview =
            document.getElementById(
                "preview"
            );


        preview.src =
            selectedImage;


        preview.classList.remove(
            "hidden"
        );
    };


    reader.readAsDataURL(file);
}


function createPost(){

    const caption =
        document
        .getElementById("caption")
        .value
        .trim();


    if(!selectedImage){

        alert(
            "Alege o fotografie."
        );

        return;
    }


    const post = {

        id:
            "post_" +
            Date.now() +
            "_" +
            Math.random()
            .toString(36)
            .slice(2),

        userId:
            currentUserId,

        image:
            selectedImage,

        caption,

        likes:[],

        comments:[],

        createdAt:
            Date.now()
    };


    posts.push(post);

    save();

    selectedImage = null;

    toast(
        "Postarea a fost publicată! 📸"
    );

    showHome();
}


/* =====================================================
   LIKE
   ===================================================== */

function toggleLike(postId){

    const post =
        posts.find(
            p => p.id === postId
        );

    if(!post) return;


    if(!post.likes){
        post.likes = [];
    }


    const index =
        post.likes.indexOf(
            currentUserId
        );


    if(index === -1){

        post.likes.push(
            currentUserId
        );

    }else{

        post.likes.splice(
            index,
            1
        );
    }


    save();

    loadFeed();
}


/* =====================================================
   COMMENTS
   ===================================================== */

function openComments(postId){

    currentCommentPost =
        postId;


    document
        .getElementById(
            "commentModal"
        )
        .classList.remove(
            "hidden"
        );


    loadComments();
}


function closeComments(){

    currentCommentPost = null;

    document
        .getElementById(
            "commentModal"
        )
        .classList.add(
            "hidden"
        );
}


function loadComments(){

    const post =
        posts.find(
            p => p.id === currentCommentPost
        );


    const list =
        document.getElementById(
            "commentsList"
        );


    list.innerHTML = "";


    if(
        !post ||
        !post.comments ||
        post.comments.length === 0
    ){

        list.innerHTML = `
            <p style="
                color:#888;
                margin-top:15px">

                Niciun comentariu.

            </p>
        `;

        return;
    }


    post.comments.forEach(comment => {

        list.innerHTML += `

            <div class="comment">

                <b>
                    ${escapeHtml(comment.username)}
                </b>

                ${escapeHtml(comment.text)}

            </div>
        `;
    });
}


function addComment(){

    const input =
        document.getElementById(
            "commentInput"
        );


    const text =
        input.value.trim();


    if(!text) return;


    const post =
        posts.find(
            p => p.id === currentCommentPost
        );


    if(!post) return;


    if(!post.comments){
        post.comments = [];
    }


    const user =
        currentUser();


    post.comments.push({

        id:
            "comment_" +
            Date.now(),

        userId:
            currentUserId,

        username:
            user.username,

        text,

        createdAt:
            Date.now()
    });


    input.value = "";

    save();

    loadComments();

    loadFeed();
}


/* =====================================================
   SEARCH
   ===================================================== */

function showSearch(){

    setActive("navSearch");


    page.innerHTML = `

        <div class="search-box">

            <input
                id="searchInput"
                placeholder="Caută persoane..."
                oninput="searchUsers()">


            <div id="searchResults"></div>

        </div>
    `;
}


function searchUsers(){

    const text =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const results =
        document.getElementById(
            "searchResults"
        );


    results.innerHTML = "";


    if(!text) return;


    const found =
        users.filter(
            user =>
            user.username
            .toLowerCase()
            .includes(text)
        );


    found.forEach(user => {

        const verified =
            user.verified
            ? `<span class="verified">✓</span>`
            : "";


        results.innerHTML += `

            <div
                class="user-result"
                onclick="openProfile('${user.id}')">

                <img
                    class="avatar"
                    src="${user.avatar || defaultAvatar(user.username)}">


                <div>

                    <b>

                        ${escapeHtml(user.username)}

                        ${verified}

                    </b>

                    <div style="color:#888">

                        ${escapeHtml(user.name)}

                    </div>

                </div>

            </div>
        `;
    });
}


/* =====================================================
   PROFILE
   ===================================================== */

function showProfile(){

    setActive("navProfile");

    openProfile(currentUserId);
}


function openProfile(userId){

    const user =
        getUser(userId);


    if(!user) return;


    const userPosts =
        posts
        .filter(
            post =>
            post.userId === userId
        )
        .sort(
            (a,b) =>
            b.createdAt - a.createdAt
        );


    const isMe =
        userId === currentUserId;


    const following =
        (user.followers || [])
        .includes(currentUserId);


    const verified =
        user.verified
        ? `<span class="verified">✓</span>`
        : "";


    const displayedFollowers =
        user.followerDisplay !== null &&
        user.followerDisplay !== undefined
        ? user.followerDisplay
        : (user.followers || []).length;


    page.innerHTML = `

        <div class="profile">

            <div class="profile-head">

                <img
                    class="profile-avatar"
                    src="${user.avatar || defaultAvatar(user.username)}">


                <div>

                    <h2>

                        ${escapeHtml(user.username)}

                        ${verified}

                    </h2>


                    <div>
                        ${escapeHtml(user.name)}
                    </div>


                    <div class="stats">

                        <div class="stat">

                            <b>
                                ${userPosts.length}
                            </b>

                            <br>
                            postări

                        </div>


                        <div class="stat">

                            <b>
                                ${displayedFollowers}
                            </b>

                            <br>
                            urmăritori

                        </div>


                        <div class="stat">

                            <b>
                                ${(user.following || []).length}
                            </b>

                            <br>
                            urmărește

                        </div>

                    </div>

                </div>

            </div>


            <div class="profile-bio">

                ${escapeHtml(user.bio || "")}

            </div>


            <div class="profile-actions">

                ${
                    isMe
                    ?
                    `
                        <button
                            class="secondary-btn"
                            onclick="logout()">

                            Ieșire din cont

                        </button>
                    `
                    :
                    `
                        <button
                            class="main-btn"
                            onclick="toggleFollow('${user.id}')">

                            ${
                                following
                                ? "Nu mai urmări"
                                : "Urmărește"
                            }

                        </button>
                    `
                }

            </div>


            <div class="grid">

                ${
                    userPosts.map(
                        post =>
                        `
                            <img
                                src="${post.image}">
                        `
                    ).join("")
                }

            </div>

        </div>
    `;
}


/* =====================================================
   FOLLOW
   ===================================================== */

function toggleFollow(userId){

    if(userId === currentUserId)
        return;


    const me =
        currentUser();


    const target =
        getUser(userId);


    if(!me || !target)
        return;


    if(!me.following)
        me.following = [];


    if(!target.followers)
        target.followers = [];


    const index =
        me.following.indexOf(
            userId
        );


    if(index === -1){

        me.following.push(
            userId
        );

        target.followers.push(
            currentUserId
        );

    }else{

        me.following.splice(
            index,
            1
        );

        const followerIndex =
            target.followers.indexOf(
                currentUserId
            );


        if(followerIndex !== -1){

            target.followers.splice(
                followerIndex,
                1
            );
        }
    }


    save();

    openProfile(userId);
}


/* =====================================================
   ADMIN PANEL
   ===================================================== */

function showAdmin(){

    if(!isAdmin()){

        alert(
            "Nu ai acces la Admin Panel."
        );

        return;
    }


    page.innerHTML = `

        <div class="admin">

            <div class="admin-title">

                👑 Admin Panel

            </div>


            <div style="
                color:#888;
                margin-bottom:20px">

                Admin:
                <b style="color:white">
                    ${escapeHtml(currentUser().username)}
                </b>

            </div>


            <div id="adminUsers"></div>

        </div>
    `;


    renderAdminUsers();
}


function renderAdminUsers(){

    const container =
        document.getElementById(
            "adminUsers"
        );


    container.innerHTML = "";


    users.forEach(user => {

        const isVerified =
            user.verified;


        const displayed =

            user.followerDisplay !== undefined
            ? user.followerDisplay
            : (user.followers || []).length;


        container.innerHTML += `

            <div class="admin-card">

                <div class="admin-user">

                    <img
                        class="avatar"
                        src="${user.avatar || defaultAvatar(user.username)}">


                    <div>

                        <b>

                            ${escapeHtml(user.username)}

                            ${
                                user.verified
                                ? `<span class="verified">✓</span>`
                                : ""
                            }

                        </b>

                        <div style="
                            color:#888">

                            ${escapeHtml(user.name)}

                        </div>

                    </div>

                </div>


                <div style="
                    margin-top:10px;
                    color:#aaa">

                    Urmăritori reali:
                    ${(user.followers || []).length}

                </div>


                <div class="admin-actions">

                    <button
                        class="verify"
                        onclick="toggleVerified('${user.id}')">

                        ${

                            ? "❌ Scoate verificarea"
                            : "🔵 Verifică utilizatorul"
                        }

                    </button>


                    <input
                        id="followers_${user.id}"
                        class="admin-number"
                        type="number"
                        min="0"
                        value="${displayed}"
                        placeholder="Număr urmăritori afișat">


                    <button
                        onclick="setFollowers('${user.id}')">

                        👥 Setează urmăritori afișați

                    </button>


                    ${
                        user.id !== currentUserId
                        ?
                        `
                            <button
                                class="danger"
                                onclick="deleteUser('${user.id}')">

                                🗑️ Șterge contul

                            </button>
                        `
                        :
                        `
                            <button disabled>

                                👑 Acesta e contul tău

                            </button>
                        `
                    }

                </div>

            </div>
        `;
    });
}


/* =====================================================
   ADMIN VERIFY
   ===================================================== */

function toggleVerified(userId){

    if(!isAdmin()) return;


    const user =
        getUser(userId);


    if(!user) return;


    user.verified =
        !user.verified;


    save();

    renderAdminUsers();

    toast(
        user.verified
        ? "Utilizator verificat 🔵"
        : "Verificarea a fost scoasă"
    );
}


/* =====================================================
   ADMIN FOLLOWER DISPLAY
   ===================================================== */

function setFollowers(userId){

    if(!isAdmin()) return;


    const user =
        getUser(userId);


    const input =
        document.getElementById(
            "followers_" + userId
        );


    const value =
        parseInt(
            input.value
        );


    if(isNaN(value) || value < 0){

        alert(
            "Introdu un număr valid."
        );

        return;
    }


    user.followerDisplay =
        value;


    save();

    renderAdminUsers();

    toast(
        "Numărul afișat a fost schimbat."
    );
}


/* =====================================================
   ADMIN DELETE USER
   ===================================================== */

function deleteUser(userId){

    if(!isAdmin()) return;


    const user =
        getUser(userId);


    if(!user) return;


    if(
        !confirm(
            "Sigur vrei să ștergi contul " +
            user.username +
            "?"
        )
    ){

        return;
    }


    users =
        users.filter(
            u => u.id !== userId
        );


    posts =
        posts.filter(
            p => p.userId !== userId
        );


    save();

    renderAdminUsers();

    toast(
        "Contul a fost șters."
    );
}


/* =====================================================
   SHARE
   ===================================================== */

function sharePost(postId){

    const url =
        location.href +
        "#post=" +
        postId;


    if(
        navigator.share
    ){

        navigator.share({

            title:"Instagame",

            text:"Vezi această postare pe Instagame!",

            url

        }).catch(
            () => {}
        );

    }else{

        navigator.clipboard
        ?.writeText(url);

        toast(
            "Link copiat!"
        );
    }
}


/* =====================================================
   NAV ACTIVE
   ===================================================== */

function setActive(id){

    document
        .querySelectorAll(
            ".bottom-nav button"
        )
        .forEach(
            button =>
            button.classList.remove(
                "active"
            )
        );


    const button =
        document.getElementById(id);


    if(button){

        button.classList.add(
            "active"
        );
    }
}


/* =====================================================
   HELPERS
   ===================================================== */

function defaultAvatar(name){

    return (
        "https://ui-avatars.com/api/?name="
        +
        encodeURIComponent(name)
        +
        "&background=222&color=fff"
    );
}


function escapeHtml(text){

    return String(text || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function toast(message){

    const old =
        document.querySelector(
            ".toast"
        );


    if(old)
        old.remove();


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "toast";


    element.textContent =
        message;


    document.body.appendChild(
        element
    );


    setTimeout(
        () => element.remove(),
        2500
    );
}
